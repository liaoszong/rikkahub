name: Quality Gate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-verification:
    name: Full tests and lint (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Verify Fork boundary
        shell: pwsh
        run: ./ops/fork-boundary/verify-fork-boundary.ps1

      - name: Run repository verification gate
        run: ./gradlew verifyForkRelease --stacktrace --no-daemon --configuration-cache

      - name: Upload diagnostic reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-verification-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/reports/**
            **/build/test-results/**

  windows-contracts:
    name: Windows platform contracts
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Parse and verify release PowerShell contracts
        shell: pwsh
        run: ./ops/ci/verify-powershell-contracts.ps1

      # These modules contain the platform-sensitive shell and line-ending
      # fixtures that previously passed on Linux while failing on Windows.
      - name: Run Windows-sensitive JVM tests
        shell: pwsh
        run: ./gradlew.bat :workspace:test :highlight:test --stacktrace --no-daemon

      - name: Upload diagnostic reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-contract-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            workspace/build/reports/**
            workspace/build/test-results/**
            highlight/build/reports/**
            highlight/build/test-results/**

  quality-gate:
    name: Required quality gate
    if: ${{ always() }}
    needs: [full-verification, windows-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification lane
        env:
          LINUX_RESULT: ${{ needs.full-verification.result }}
          WINDOWS_RESULT: ${{ needs.windows-contracts.result }}
        run: |
          echo "Linux verification:  $LINUX_RESULT"
          echo "Windows contracts:   $WINDOWS_RESULT"
          test "$LINUX_RESULT" = success
          test "$WINDOWS_RESULT" = success
